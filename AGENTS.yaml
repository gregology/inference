context:
  - match: ["models.toml"]
    on: [edit]
    when: before
    content: |
      models.toml is the single source of truth for model downloads and router
      configuration. Both installer/steps/models.py (downloads) and
      installer/steps/router_config.py (generates models.ini) read from it.
      No model-specific data should exist in Python code.

      Prefer Q4_K_M quantizations. For GPU-run models, use plain K-quant
      files (Q4_K/Q6_K tensors only): IQ4_XS-heavy quants, including
      unsloth's UD-* files, run ~35% slower on the O6's Mali. Check
      https://huggingface.co/unsloth first, then sources such as
      lmstudio-community. Run IQ-heavy files on the CPU instead
      (`device = "none"`, `gpu_layers = 0`, `threads = 8`,
      `threads_batch = 12`).

      For multi-shard models that exceed 64GB RAM, use `include` instead of
      `file`, set `large = true`, and run the profile on the CPU:
      `device = "none"`, `gpu_layers = 0`,
      `extra = { load_mode = "mmap", threads = 8, threads_batch = 12 }`.
      Leave out threads_batch when the profile has more than one slot.

      GPU profiles on the Mali set `ubatch_size = 64` (ggml-vulkan's fastest
      matmul tile there); CPU profiles keep the default, where it makes no
      difference.

      Router keys must be valid llama-server options: the router refuses to
      start on unknown keys (e.g. the removed `mmap`/`mlock` flags).

  - match: ["installer/steps/*.py"]
    on: [edit, create]
    when: before
    content: |
      Every step must be idempotent. Implement check() to detect whether the
      step has already been applied, and run() to apply it. The runner skips
      steps where check() returns True.

      Use self.sh() for commands that must succeed, self.sh_ok() for probes,
      self.sh_live() for long-running commands that should stream output.

decisions:
  - decision: "Zero external Python dependencies for the installer"
    rationale: |
      The installer runs via curl-pipe-bash on a fresh Debian system. Adding
      pip dependencies to the installer itself would require bootstrapping a
      venv before the installer can start. Using stdlib tomllib (Python 3.11+)
      for TOML and string formatting for templates keeps the bootstrap to
      ~30 lines of shell that only needs git and python3.
    match: ["installer/**/*.py"]

  - decision: "TOML over YAML for model manifest"
    rationale: |
      TOML is parsed by stdlib tomllib (Python 3.11+), requiring zero external
      dependencies. YAML would require PyYAML. The model manifest structure
      (flat key-value with nested profiles) maps naturally to TOML sections.
    match: ["models.toml", "installer/config.py"]

  - decision: "Prefer plain K-quant GGUFs; unsloth first when it has one"
    rationale: |
      The O6's 64GB unified memory makes Q4_K_M the sweet spot — small enough
      to fit alongside the system, large enough to preserve model quality.
      Unsloth has consistent naming and reliable availability, but its UD-*
      quants mix in IQ4_XS, which the Mali runs ~35% slower than Q4_K
      (27B: 2.6/1.5 vs 3.9/2.4 tok/s prompt/generation). Use a plain Q4_K_M
      (e.g. lmstudio-community) for GPU-run models.
    match: ["models.toml"]

  - decision: "Large MoE models run CPU-only"
    rationale: |
      On the O6, keeping routed experts on the CPU and the rest on the GPU
      (cpu_moe) was 1.5-2.5x slower than running the whole model on the CPU:
      the Mali's kernels are slow and each layer hands off between devices.
      Flash-Next went from 1.0/1.9 to 7.9/5.0 tok/s, GLM-5.3 from 0.63 to
      1.05 tok/s generation. Generate on 8 threads; 12 pulls in the slow
      A520 cores. Prompt processing is 6-16% faster on 12 (threads_batch),
      but only set it on single-slot profiles: llama.cpp uses batch threads
      whenever slots generate together, which slowed Flash-Next's two slots
      by 24%.
    revisit_when: "ggml-vulkan's Mali matmul kernels or the Mali driver improve"
    match: ["models.toml"]

  - decision: "models.toml as single source of truth"
    rationale: |
      Both model downloads and router config generation derive from the same
      file. This prevents drift between what's downloaded and what's configured.
      Adding or removing a model is a single edit to one file.
    match: ["models.toml", "installer/steps/models.py", "installer/steps/router_config.py"]

  - decision: "Idempotent step pattern with check/run"
    rationale: |
      The installer is designed to be re-run. Each step's check() method
      determines whether work is needed. This avoids re-downloading models,
      re-building llama.cpp, or re-installing packages on subsequent runs.
      The models step always runs because it needs to diff desired vs installed.
    match: ["installer/step.py", "installer/steps/*.py"]

  - decision: "Dedicated llm system user"
    rationale: |
      The llama-server runs as a non-login system user under /srv/llm. This
      limits blast radius, keeps model files owned by a single user, and
      follows the convention of system services not running as root.
    match: ["installer/steps/user.py", "installer/steps/systemd.py"]

  - decision: "Pin llama.cpp to 914dde72b (b8005)"
    rationale: |
      Builds after 914dde72b have two confirmed bugs on the O6's Mali G720
      Immortalis GPU:
        1. GGML_ASSERT(descriptor_set_idx < descriptor_sets.size()) crash in
           ggml_vk_dispatch_pipeline — triggers even with -ngl 0 on UMA
           devices; no workaround found (ggml-org/llama.cpp#23057).
        2. MUL_MAT produces incorrect results across all data types on
           Mali-G720 Vulkan; 167/860 backend-ops tests fail
           (ggml-org/llama.cpp#23241).
      Both issues are confirmed on the CIX CP8180 SoC (same GPU IP as the
      O6) running Debian aarch64 on recent HEAD commits. The pin is
      configured via [build] llama_cpp_ref in models.toml.
    revisit_when: "ggml-org/llama.cpp#23057 and #23241 are both resolved"
    match: ["models.toml", "installer/steps/build_llama.py"]

  - decision: "Gemma 4 models excluded"
    rationale: |
      The gemma4 architecture was added to llama.cpp at b8637 (PR #21309,
      Apr 2 2026). Every build that supports gemma4 also has the Mali Vulkan
      bugs (ggml-org/llama.cpp#23057, #23241). There is no build that
      supports gemma4 and working Vulkan on the O6's Mali G720. Gemma 4
      models were removed from models.toml rather than kept as commented-out
      blocks. When the Vulkan fixes land, bump llama_cpp_ref and re-add:
        gemma-4-31b: unsloth/gemma-4-31B-it-GGUF (gemma-4-31B-it-Q4_K_M.gguf)
        gemma-4-26b-a4b: unsloth/gemma-4-26B-A4B-it-GGUF (gemma-4-26B-A4B-it-UD-Q4_K_M.gguf)
    revisit_when: "ggml-org/llama.cpp#23057 and #23241 are both resolved"
    match: ["models.toml"]

  - decision: "Hardware detection is passive, not prescriptive"
    rationale: |
      hardware.py detects what's available (GPU, NPU, Coral, PCIe) but doesn't
      force configuration changes. Steps query the Hardware dataclass and adapt.
      This keeps the door open for future extensions (NPU offload, Coral for
      edge models, discrete GPU) without coupling detection to action.
    match: ["installer/hardware.py"]
