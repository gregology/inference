# inference model manifest
#
# This file defines which models to download and how to expose them
# via the llama-server router. Run the installer again after editing
# to apply changes.
#
# Structure:
#   [models.<id>]           — one entry per GGUF download
#   [models.<id>.profiles]  — one or more router profiles per model
#
# To remove a model: delete its [models.<id>] block and re-run the
# installer with --prune to also delete the files from disk.
#
# The optional `dir` field sets the on-disk directory name under
# /srv/llm/models/. If omitted, the TOML key (id) is used.

[build]
# Pin llama.cpp to a specific commit. Set to "latest" to track HEAD.
#
# History: this used to be pinned to 914dde72b (b8005) to dodge the Mali Vulkan
# descriptor-set assert (GGML_ASSERT(descriptor_set_idx < descriptor_sets.size()))
# on the G720/CIX CP8180 — ggml-org/llama.cpp#23057. Root cause was a 32-bit
# overflow in CEIL_DIV when the Mali/CIX driver reports
# maxComputeWorkGroupCount = UINT32_MAX; fixed upstream by PR #25245
# (merged 2026-07-06, commit 86961efd5675), so the workaround is obsolete.
#
# "latest" is now required anyway: Qwen3.8 and GLM-5.3 use architectures that
# only exist in recent builds (GLM-5.3-Flash: PR #27773; Qwen3.8 series support
# also landed well after b8005). The old pin predates all of these and
# llama-server refuses to load them, leaving router requests hanging.
llama_cpp_ref = "latest"

[defaults]
# llama.cpp replaced --mmap/--mlock with --load-mode (the old flags were
# removed in ggml-org/llama.cpp#28334, and the router rejects unknown keys).
# "auto" mmaps except on iGPUs such as the O6's Mali, where it reads straight
# into device memory instead of holding the model in RAM twice
# (ggml-org/llama.cpp#26081). Large models override this with "mmap".
load_mode = "auto"
parallel = 1
cache_type_k = "q4_0"
cache_type_v = "q4_0"
device = "Vulkan0"
gpu_layers = "auto"
ctx_size = 8192
no_warmup = true
# RAM prompt cache (MiB). Prompt processing runs at 2-8 tok/s on the O6, so
# re-processing a conversation after switching away from it can take tens
# of minutes; the cache restores it in seconds.
cache_ram = 8192

# ── Small / Medium models ────────────────────────────────────────
#
# Dense hybrid-attention models: only 16 of 64 layers keep a KV cache
# (the rest are Gated DeltaNet with fixed-size state), so q4_0 KV costs
# ~18 KiB/token. The trained max of 256K is ~4.5 GiB of KV (~5.3 GiB
# with compute buffers) on top of ~16 GB of weights. One prompt can't fill
# it (~18 h at ~4 tok/s), but with the prompt cache a conversation grows
# a turn at a time, so there's no reason to cap it lower.
#
# On the Mali, plain Q4_K/Q6_K files are much faster than mixes with IQ
# types: IQ4_XS-heavy quants run ~35% slower on the GPU (and OrcaSAQ,
# which is mostly IQ4_XS, is faster on the CPU). Generation runs at
# 2-2.5 tok/s, so thinking is capped at 1024 tokens (~7 min).

# ── Qwen 3.8 ────────────────────────────────────────────────────

# Not unsloth: its UD-Q4_K_M mixes in ~5 GB of IQ4_XS. This file is plain
# Q4_K/Q6_K, the same tensor mix as the uncensored Q4_K_M below.
[models.qwen3_8-27b]
repo = "lmstudio-community/Qwen3.8-27B-GGUF"
file = "Qwen3.8-27B-Q4_K_M.gguf"
dir = "qwen-3.8-27b-q4_k_m"

[models.qwen3_8-27b.profiles.default]
name = "qwen3.8:27b"
ctx_size = 262144
gpu_layers = 999
extra = { reasoning_budget = 1024 }

# Gated repo: needs an HF token for the llm user (see README).
[models.qwen3_8-27b-uncensored]
repo = "orcarouter/Qwen3.8-27B-Uncensored-GGUF"
file = "Qwen3.8-27B-Uncensored-Q4_K_M.gguf"
dir = "qwen-3.8-27b-uncensored"

[models.qwen3_8-27b-uncensored.profiles.default]
name = "qwen3.8-uncensored:27b"
ctx_size = 262144
gpu_layers = 999
extra = { reasoning_budget = 1024 }

# ── OrcaSAQ 2 ───────────────────────────────────────────────────

# Single-file mixed-precision quant (IQ4_XS/Q5_K/Q6_K) of the same
# Qwen3.8-27B-Uncensored weights. Gated repo. The Mali's IQ4_XS kernels
# are slow, so this runs on the CPU's 8 big cores instead.
[models.orcasaq-2-cyber-27b]
repo = "orcarouter/OrcaSAQ-2-Cyber-27B-Uncensored-GGUF"
file = "OrcaSAQ-2-27B-Uncensored.gguf"
dir = "orcasaq-2-cyber-27b-uncensored"

[models.orcasaq-2-cyber-27b.profiles.default]
name = "orcasaq-2-cyber:27b"
ctx_size = 262144
device = "none"
gpu_layers = 0
extra = { threads = 8, reasoning_budget = 1024 }

# ── Large models (exceed 64GB, rely on mmap) ─────────────────────
#
# These run entirely on the CPU, with the weights in mmap'd, evictable
# page cache. Splitting them (experts on the CPU, the rest on the GPU)
# was 1.5-2.5x slower: the Mali's kernels are slow and every layer hands
# off between devices. Use 8 threads: the 4 little A520 cores hold the
# big ones back. Every GB of RAM used elsewhere is a GB of experts
# re-read from NVMe, so these keep context checkpoints (recurrent-state
# snapshots, 32 per slot by default) few. Context runs at the trained
# max: it costs ~5.5 GiB (Flash-Next, both slots) and ~9 GiB (GLM, mostly
# compute buffers), with no measurable slowdown on short requests.
# Thinking budgets are sized for ~7-8 minutes at each model's generation
# speed (Flash-Next ~5 tok/s, GLM ~1 tok/s).

# IQ4_XS over Q4_K_M: 65 GB of routed experts vs 81 GB (K-quants fall
# back to Q8_0/Q5_0 on the 640-wide ffn_down), so far more of the expert
# set stays resident in RAM. The 29 GB PLE n-gram table is read a few
# rows per token. KV is ~7 KiB/token. Gated repo.
#
# Two slots: each request gets ~2.9 tok/s instead of one waiting (total
# ~5.8 vs 5.0 tok/s). ctx_size is split between slots, so 524288 gives
# each request the trained 256K.
[models.qwen3_8-flash-next-uncensored]
repo = "orcarouter/Qwen3.8-Flash-Next-Uncensored-GGUF"
include = "Qwen3.8-Flash-Next-Uncensored-IQ4_XS-*.gguf"
large = true
dir = "qwen-3.8-flash-next-uncensored"

[models.qwen3_8-flash-next-uncensored.profiles.default]
name = "qwen3.8-flash-next-uncensored:125b"
ctx_size = 524288
device = "none"
gpu_layers = 0
extra = { load_mode = "mmap", threads = 8, ctx_checkpoints = 8, reasoning_budget = 2048, parallel = 2 }

# orcarouter's own GLM-5.3-Flash-Uncensored GGUFs were converted with the
# abandoned glm5next fork (ggml-org/llama.cpp#27754) and fail on mainline
# with "unknown model architecture: 'glm5next'". This is an imatrix
# re-quant of the same orcarouter weights with a mainline (glm5-next)
# header. IQ3_XXS is its largest quant (134 GB).
[models.glm-5_3-flash-uncensored]
repo = "BoldingBuilds/orcarouter_GLM-5.3-Flash-Uncensored-GGUF"
include = "IQ3_XXS/*"
large = true
dir = "glm-5.3-flash-uncensored"

[models.glm-5_3-flash-uncensored.profiles.default]
name = "glm-5.3-flash-uncensored:320b"
ctx_size = 1048576
device = "none"
gpu_layers = 0
extra = { load_mode = "mmap", threads = 8, ctx_checkpoints = 8, reasoning_budget = 512 }
