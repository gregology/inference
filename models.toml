# inference model manifest
#
# This file defines which models to download and how to expose them
# via the llama-server router. Run the installer again after editing
# to apply changes.
#
# Structure:
#   [models.<id>]           — one entry per GGUF download
#   [models.<id>.profiles]  — one or more router profiles per model
#
# To remove a model: delete its [models.<id>] block and re-run the
# installer with --prune to also delete the files from disk.
#
# The optional `dir` field sets the on-disk directory name under
# /srv/llm/models/. If omitted, the TOML key (id) is used.

[build]
# Pin llama.cpp to a specific commit. Set to "latest" to track HEAD.
#
# History: this used to be pinned to 914dde72b (b8005) to dodge the Mali Vulkan
# descriptor-set assert (GGML_ASSERT(descriptor_set_idx < descriptor_sets.size()))
# on the G720/CIX CP8180 — ggml-org/llama.cpp#23057. Root cause was a 32-bit
# overflow in CEIL_DIV when the Mali/CIX driver reports
# maxComputeWorkGroupCount = UINT32_MAX; fixed upstream by PR #25245
# (merged 2026-07-06, commit 86961efd5675), so the workaround is obsolete.
#
# "latest" is now required anyway: Qwen3.8 and GLM-5.3 use architectures that
# only exist in recent builds (GLM-5.3-Flash: PR #27773; Qwen3.8 series support
# also landed well after b8005). The old pin predates all of these and
# llama-server refuses to load them, leaving router requests hanging.
llama_cpp_ref = "latest"

[router]
# Models kept loaded at once; loading another unloads the least recently
# used. Two lets a -gpu profile answer while a CPU model does (27B on the
# GPU + Flash-Next: ~2.1 + ~3.5 tok/s at once), and switching back to a
# loaded model keeps its prompt cache. An idle loaded model still holds
# its RAM: GLM generates ~15% slower with a 27B loaded beside it. Set to
# 1 to unload the previous model on every switch.
models_max = 2

[defaults]
# llama.cpp replaced --mmap/--mlock with --load-mode (the old flags were
# removed in ggml-org/llama.cpp#28334, and the router rejects unknown keys).
# "auto" mmaps except on iGPUs such as the O6's Mali, where it reads straight
# into device memory instead of holding the model in RAM twice
# (ggml-org/llama.cpp#26081). Large models override this with "mmap".
load_mode = "auto"
parallel = 1
cache_type_k = "q4_0"
cache_type_v = "q4_0"
device = "Vulkan0"
gpu_layers = "auto"
ctx_size = 8192
no_warmup = true
# RAM prompt cache (MiB). Prompt processing runs at 2-8 tok/s on the O6, so
# re-processing a conversation after switching away from it can take tens
# of minutes; the cache restores it in seconds.
cache_ram = 8192

# ── Small / Medium models ────────────────────────────────────────
#
# Dense hybrid-attention models: only 16 of 64 layers keep a KV cache
# (the rest are Gated DeltaNet with fixed-size state), so q4_0 KV costs
# ~18 KiB/token. The trained max of 256K is ~4.5 GiB of KV (~5.3 GiB
# with compute buffers) on top of ~16 GB of weights. One prompt can't fill
# it (~18 h at ~4 tok/s), but with the prompt cache a conversation grows
# a turn at a time, so there's no reason to cap it lower.
#
# These run on the CPU's 8 big cores, which with the int8 matmul kernels
# (see hardware.arm_march) process 27B prompts at ~10 tok/s against the
# Mali's ~4.4, and generate at ~2.25 tok/s against ~2.4. Short follow-ups
# gain the most: a 23-token message takes 4 s instead of 21 s. Generation
# runs at 2-2.5 tok/s, so thinking is capped at 1024 tokens (~7 min).
#
# The -gpu profiles run the same files on the Mali, for use beside a CPU
# model: two models generating at once get ~5.6 tok/s between them with
# the 27B on the GPU, against ~3.0 with both on the CPU. They keep one CPU
# thread (threads = 1); with the default of 12, their idle threads took
# cores from the CPU model and slowed it by ~20%.
#
# On the Mali, plain Q4_K/Q6_K files are much faster than mixes with IQ
# types: IQ4_XS-heavy quants run ~35% slower on the GPU.
#
# GPU profiles process prompts in 64-token ubatches. ggml-vulkan picks its
# matmul tile from the batch size, and on the Mali the 64-wide tile is the
# fastest: 4.65 tok/s on a 512-token prompt, against 3.90-4.12 for the
# default 512 ubatch (128-wide tile) and 1.9 or less for batches of 9-32
# tokens (32-wide tile). Other sizes pad up to the next tile (96: 3.09).

# ── Qwen 3.8 ────────────────────────────────────────────────────

# Not unsloth: its UD-Q4_K_M mixes in ~5 GB of IQ4_XS. This file is plain
# Q4_K/Q6_K, the same tensor mix as the uncensored Q4_K_M below.
[models.qwen3_8-27b]
repo = "lmstudio-community/Qwen3.8-27B-GGUF"
file = "Qwen3.8-27B-Q4_K_M.gguf"
dir = "qwen-3.8-27b-q4_k_m"

[models.qwen3_8-27b.profiles.default]
name = "qwen3.8:27b"
ctx_size = 262144
device = "none"
gpu_layers = 0
extra = { threads = 8, threads_batch = 12, reasoning_budget = 1024 }

[models.qwen3_8-27b.profiles.gpu]
name = "qwen3.8-gpu:27b"
ctx_size = 262144
gpu_layers = 999
extra = { threads = 1, reasoning_budget = 1024, ubatch_size = 64 }

# Gated repo: needs an HF token for the llm user (see README).
[models.qwen3_8-27b-uncensored]
repo = "orcarouter/Qwen3.8-27B-Uncensored-GGUF"
file = "Qwen3.8-27B-Uncensored-Q4_K_M.gguf"
dir = "qwen-3.8-27b-uncensored"

[models.qwen3_8-27b-uncensored.profiles.default]
name = "qwen3.8-uncensored:27b"
ctx_size = 262144
device = "none"
gpu_layers = 0
extra = { threads = 8, threads_batch = 12, reasoning_budget = 1024 }

[models.qwen3_8-27b-uncensored.profiles.gpu]
name = "qwen3.8-uncensored-gpu:27b"
ctx_size = 262144
gpu_layers = 999
extra = { threads = 1, reasoning_budget = 1024, ubatch_size = 64 }

# ── OrcaSAQ 2 ───────────────────────────────────────────────────

# Single-file mixed-precision quant (IQ4_XS/Q5_K/Q6_K) of the same
# Qwen3.8-27B-Uncensored weights. Gated repo. The Mali's IQ4_XS kernels
# are slow, so it has no GPU profile. Prompts are processed on all 12
# cores (threads_batch), ~11% faster than on 8.
[models.orcasaq-2-cyber-27b]
repo = "orcarouter/OrcaSAQ-2-Cyber-27B-Uncensored-GGUF"
file = "OrcaSAQ-2-27B-Uncensored.gguf"
dir = "orcasaq-2-cyber-27b-uncensored"

[models.orcasaq-2-cyber-27b.profiles.default]
name = "orcasaq-2-cyber:27b"
ctx_size = 262144
device = "none"
gpu_layers = 0
extra = { threads = 8, threads_batch = 12, reasoning_budget = 1024 }

# ── Voice assistant ─────────────────────────────────────────────
#
# Answers Home Assistant's Assist pipeline (the smart speaker) through HA's
# llama.cpp conversation integration. The port makes it resident: it runs
# in its own always-on llama-server (llama-voice-9b.service), so the
# router's LRU never unloads it and its prompt cache keeps HA's system
# prompt warm between questions.
#
# Measured with llama-bench on the 8 big cores (q4_0 KV, flash attention),
# prompt / generation tok/s: Qwen3.5-4B 51 / 12.4, Gemma-4-E4B 37 / 10.7,
# this 9B 30 / 7.1, Gemma4-12B 18.5 / 4.9. Asked five questions with a
# web_search tool, the 9B answered or searched correctly 5/5 in 6-15 s; the
# 4B scored 4/5 (it answered a current-events question from memory, wrongly)
# and Gemma-4-E4B spoke its reasoning even with thinking off. Thinking is
# off here: a spoken answer can't wait for it.
[models.qwen3_5-9b-uncensored]
repo = "HauhauCS/Qwen3.5-9B-Uncensored-HauhauCS-Aggressive"
file = "Qwen3.5-9B-Uncensored-HauhauCS-Aggressive-Q4_K_M.gguf"
dir = "qwen-3.5-9b-uncensored"

[models.qwen3_5-9b-uncensored.profiles.voice]
name = "voice:9b"
port = 8001
ctx_size = 32768
device = "none"
gpu_layers = 0
extra = { threads = 8, threads_batch = 12, jinja = true, reasoning_budget = 0 }

# ── Large models (exceed 64GB, rely on mmap) ─────────────────────
#
# These run entirely on the CPU, with the weights in mmap'd, evictable
# page cache. Splitting them (experts on the CPU, the rest on the GPU)
# was 1.5-2.5x slower: the Mali's kernels are slow and every layer hands
# off between devices. Generate on 8 threads: the 4 little A520 cores
# hold the big ones back. Prompt processing is the exception, and GLM
# runs it on all 12 (threads_batch, ~6% faster). Flash-Next doesn't:
# llama.cpp also uses the batch threads when its two slots generate
# together, which made each 24% slower. Every GB of RAM used elsewhere
# is a GB of experts re-read from NVMe, so these keep context checkpoints
# (recurrent-state snapshots, 32 per slot by default) few, and skip weight
# repacking (no_repack): llama.cpp copies the tensors it can repack for
# its int8 matmul kernels (Flash-Next's IQ4_NL experts, GLM's Q8_0) out of
# the page cache into RAM, which cost Flash-Next ~25% of its generation
# speed for ~20% faster prompts. Context runs
# at the trained max: it costs ~5.5 GiB (Flash-Next, both slots) and
# ~9 GiB (GLM, mostly compute buffers), with no measurable slowdown on
# short requests.
# Thinking budgets are sized for ~7-8 minutes at each model's generation
# speed (Flash-Next ~5 tok/s, GLM ~1 tok/s).

# IQ4_XS over Q4_K_M: 65 GB of routed experts vs 81 GB (K-quants fall
# back to Q8_0/Q5_0 on the 640-wide ffn_down), so far more of the expert
# set stays resident in RAM. The 29 GB PLE n-gram table is read a few
# rows per token. KV is ~7 KiB/token. Gated repo.
#
# Two slots: each request gets ~2.9 tok/s instead of one waiting (total
# ~5.8 vs 5.0 tok/s). ctx_size is split between slots, so 524288 gives
# each request the trained 256K.
[models.qwen3_8-flash-next-uncensored]
repo = "orcarouter/Qwen3.8-Flash-Next-Uncensored-GGUF"
include = "Qwen3.8-Flash-Next-Uncensored-IQ4_XS-*.gguf"
large = true
dir = "qwen-3.8-flash-next-uncensored"

[models.qwen3_8-flash-next-uncensored.profiles.default]
name = "qwen3.8-flash-next-uncensored:125b"
ctx_size = 524288
device = "none"
gpu_layers = 0
extra = { load_mode = "mmap", no_repack = true, threads = 8, ctx_checkpoints = 8, reasoning_budget = 2048, parallel = 2 }

# orcarouter's own GLM-5.3-Flash-Uncensored GGUFs were converted with the
# abandoned glm5next fork (ggml-org/llama.cpp#27754) and fail on mainline
# with "unknown model architecture: 'glm5next'". This is an imatrix
# re-quant of the same orcarouter weights with a mainline (glm5-next)
# header. IQ3_XXS is its largest quant (134 GB).
[models.glm-5_3-flash-uncensored]
repo = "BoldingBuilds/orcarouter_GLM-5.3-Flash-Uncensored-GGUF"
include = "IQ3_XXS/*"
large = true
dir = "glm-5.3-flash-uncensored"

[models.glm-5_3-flash-uncensored.profiles.default]
name = "glm-5.3-flash-uncensored:320b"
ctx_size = 1048576
device = "none"
gpu_layers = 0
extra = { load_mode = "mmap", no_repack = true, threads = 8, threads_batch = 12, ctx_checkpoints = 8, reasoning_budget = 512 }

# ── Services ────────────────────────────────────────────────────
#
# Python network services for the smart speaker, each in its own venv
# under /srv/llm/services/<name> and run as the llm user. Args can use
# {port}, {data} (the service's data dir) and {download} (where the
# `download` repo was fetched).

# Speech-to-text for Home Assistant (Wyoming, add as a Wyoming integration).
# Tested through this server on the O6, pinned to 4 big cores, with three
# clean clips ("What is the weather like tomorrow?", "Play Dolly Parton in
# the studio.", a 4 s question): Qwen3-ASR 0.6B was right on all three in
# 0.55-1.0 s after the audio ended. Parakeet TDT 0.6B (sherpa) took 0.13 s
# but heard "Deli Parton", as did Whisper small.en (2.3 s); Whisper
# base.en was right in 0.75 s, medium.en in 6.5 s. Qwen3-ASR also takes a
# biasing prompt (entity names), which Parakeet can't.
[services.stt]
package = "wyoming-faster-whisper[qwen3-asr]==3.8.1"
module = "wyoming_faster_whisper"
port = 10300
download = "rhasspy/qwen3-asr-0.6b-onnx-int4"
args = ["--uri", "tcp://0.0.0.0:{port}", "--stt-library", "qwen3-asr", "--model", "{download}",
        "--data-dir", "{data}", "--language", "en", "--cpu-threads", "4"]

# Text-to-speech for Home Assistant (Wyoming). Piper synthesizes ~14x
# faster than real time on the O6 (1.9 s of speech in 0.16 s). The voice
# downloads into the data dir on first start.
[services.tts]
package = "wyoming-piper==2.5.2"
module = "wyoming_piper"
port = 10200
args = ["--uri", "tcp://0.0.0.0:{port}", "--voice", "en_US-lessac-medium", "--data-dir", "{data}"]

# DeepSeek web search as MCP tools (web_search, fetch_page) for Home
# Assistant's LLM agents (add as an MCP integration, SSE URL
# http://<host>:10500/sse). DeepSeek bills per successful request, so only
# Home Assistant (10.0.0.99) and loopback may connect. The env file holds
# DEEPSEEK_API_KEY (owner llm, mode 0600).
[services.search]
package = "mcp==2.3.0"
script = "services/deepseek_search_mcp.py"
port = 10500
env_file = "/srv/llm/etc/deepseek.env"
args = ["--host", "0.0.0.0", "--port", "{port}", "--allow", "10.0.0.99", "--allow", "127.0.0.1"]
