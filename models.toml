# inference model manifest
#
# This file defines which models to download and how to expose them
# via the llama-server router. Run the installer again after editing
# to apply changes.
#
# Structure:
#   [models.<id>]           — one entry per GGUF download
#   [models.<id>.profiles]  — one or more router profiles per model
#
# To remove a model: delete its [models.<id>] block and re-run the
# installer with --prune to also delete the files from disk.
#
# The optional `dir` field sets the on-disk directory name under
# /srv/llm/models/. If omitted, the TOML key (id) is used.

[build]
# Pin llama.cpp to a specific commit. Set to "latest" to track HEAD.
# b8005 (914dde72b) is the last known build without the Mali Vulkan
# descriptor set regression (ggml-vulkan.cpp assertion failure).
llama_cpp_ref = "914dde72b"

[defaults]
mmap = true
parallel = 1
cache_type_k = "q4_0"
cache_type_v = "q4_0"
device = "Vulkan0"
gpu_layers = "auto"
ctx_size = 8192
no_warmup = true

# ── Small / Medium models ────────────────────────────────────────

# ── OLMo ─────────────────────────────────────────────────────────

[models.olmo-3_1-32b-think]
repo = "unsloth/Olmo-3.1-32B-Think-GGUF"
file = "Olmo-3.1-32B-Think-Q4_K_M.gguf"
dir = "olmo-3.1-32b-think"

[models.olmo-3_1-32b-think.profiles.default]
name = "olmo-3.1-thinking:32b"
ctx_size = 16384

# ── Qwen 3.8 ────────────────────────────────────────────────────

[models.qwen3_8-27b]
repo = "unsloth/Qwen3.8-27B-GGUF"
file = "Qwen3.8-27B-UD-Q4_K_M.gguf"
dir = "qwen-3.8-27b"

[models.qwen3_8-27b.profiles.default]
name = "qwen3.8:27b"
ctx_size = 65536
gpu_layers = 999

# ── Large models (exceed 64GB, rely on mmap) ─────────────────────

[models.glm-5_1]
repo = "unsloth/GLM-5.1-GGUF"
include = "UD-Q4_K_XL/*"
large = true
dir = "glm-5.1"

[models.glm-5_1.profiles.default]
name = "glm-5.1:744b"
ctx_size = 32768
gpu_layers = 999
extra = { mlock = false, cpu_moe = true, threads = 8, jinja = true }

[models.glm-5_3-flash]
repo = "unsloth/GLM-5.3-Flash-GGUF"
include = "UD-Q4_K_XL/*"
large = true
dir = "glm-5.3-flash"

[models.glm-5_3-flash.profiles.default]
name = "glm-5.3-flash:320b"
ctx_size = 32768
gpu_layers = 999
extra = { mlock = false, cpu_moe = true, threads = 8, jinja = true, temp = 1.0, top_p = 0.95 }

[models.qwen3_8-flash-next]
repo = "unsloth/Qwen3.8-Flash-Next-GGUF"
include = "UD-Q4_K_XL/*"
large = true
dir = "qwen-3.8-flash-next"

[models.qwen3_8-flash-next.profiles.default]
name = "qwen3.8-flash-next:125b"
ctx_size = 32768
gpu_layers = 999
extra = { mlock = false, cpu_moe = true, threads = 8 }
